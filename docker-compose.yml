# LOCAL-DEV / SELF-HOST stack (bundled Mongo + Caddy auto-HTTPS).
# Production runs `docker-compose.prod.yml` (server-only, Atlas + Vertex, behind
# Caddy on the HOST) — see that file. Do NOT point production at this one.
#
# The dashboard image is Caddy serving the built SPA: it reverse-proxies /api to
# the server and provisions TLS automatically (Let's Encrypt for a real $DOMAIN,
# a locally-trusted cert for the default `localhost`). No certbot, no cert dance.
#
# All services cap their JSON logs so a chatty container can't fill the disk
# (a real incident here once hit 93% disk).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    # Not exposed to host in production — only server connects internally

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - mongo
    # Pass the WHOLE .env (Vertex, SMTP, GEMINI_MODEL, RUN_MIGRATIONS,
    # AI_MONTHLY_CAP_DEFAULT, APP_URL, …) — the old cherry-picked list silently
    # dropped most of it. `environment` below overrides only the few values that
    # are compose-specific (the bundled-Mongo URL, etc.).
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_CONNECTION_URL: mongodb://root:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/bhashajs?authSource=admin
      CORS_ORIGIN: ${CORS_ORIGIN:-https://bhashajs.com}

  dashboard:
    build:
      # Build from the MONOREPO ROOT so the npm workspace links `bhasha-js` to the
      # local packages/sdk instead of fetching it from the public registry. This
      # decouples the self-host build from npm release ordering (the public
      # registry may lag the in-repo SDK version).
      context: .
      dockerfile: packages/dashboard/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The public address Caddy serves. Defaults to `localhost` (internal cert)
      # so the stack works out of the box; set DOMAIN in .env for a real domain
      # and Caddy auto-provisions a Let's Encrypt certificate.
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # Persist issued certs/keys + Caddy's autosave config across restarts so a
      # redeploy doesn't re-hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
