# LOCAL-DEV / SELF-HOST stack (bundled Mongo + nginx + certbot).
# Production runs `docker-compose.prod.yml` (server-only, Atlas + Vertex, behind
# Caddy) — see that file. Do NOT point production at this one.
#
# All services cap their JSON logs so a chatty container can't fill the disk
# (a real incident here once hit 93% disk).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    # Not exposed to host in production — only server connects internally

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_CONNECTION_URL: mongodb://root:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/bhashajs?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://bhashajs.com}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}

  dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Runs once to get certs, then exits. Renewal via cron on host.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h; certbot renew; done'"

volumes:
  mongo_data:
  certbot_webroot:
  certbot_certs:
